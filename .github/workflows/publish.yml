name: Publish Tempo image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tempo-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  image:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "TEMPO_IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: tempo:candidate
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=tempo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tempo-${{ matrix.arch }}
      - name: Check the running image
        run: bash scripts/smoke-container.sh tempo:candidate
      - name: Publish tested candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag tempo:candidate "$TEMPO_IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$TEMPO_IMAGE:sha-$GITHUB_SHA-$ARCH"

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine native AMD64 and ARM64 images
        id: manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          printf 'Published tested image: `%s@%s`\n\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'Pushes to main deploy automatically. This digest is also available for manual deployment or rollback.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [checks, image, manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.manifest.outputs.image }}
    secrets: inherit
