name: tempo
services:
  tempo:
    image: ${TEMPO_IMAGE:-tempo:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "${TEMPO_HOST_BIND:-127.0.0.1}:${TEMPO_PORT:-8080}:8080"
    volumes:
      - tempo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 90s
    mem_limit: 1g
    cpus: 2
volumes:
  tempo-data:
